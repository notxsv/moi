        <div id="zegar"></div>

<script>
  
    function formatuj(n) {
    return n < 10 ? "0" + n : n;
  }

  function pokazDateICzas() {
    const teraz = new Date();

    const godzina = formatuj(teraz.getHours());
    const minuta = formatuj(teraz.getMinutes());
    const sekunda = formatuj(teraz.getSeconds());

    const dzien = formatuj(teraz.getDate());
    const miesiac = formatuj(teraz.getMonth() + 1);
    const rok = teraz.getFullYear();

    document.getElementById("zegar").innerHTML =
      `${godzina}:${minuta}:${sekunda} ${dzien}.${miesiac}.${rok}`;
  }

  
  pokazDateICzas();
  
  setInterval(pokazDateICzas, 1000);
</script>
