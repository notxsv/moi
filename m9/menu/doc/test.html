<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Znak wodny</title>
  <style>
    body { margin: 0; min-height: 100dvh; background: #f5f1ea; display: grid; place-items: center; font-family: Georgia, serif; }

    /* Znak wodny — jeden element na środku */
    #wm {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 9999;
    }

    #wm span {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 10vw, 4rem);
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .13;
      transform: rotate(-30deg);
      /* Płynna zmiana koloru */
      transition: color .4s ease, opacity .4s ease;
      color: hsl(220, 20%, 30%);
      /* Subtelny rozmyty cień — pogłębia efekt wodny */
      text-shadow: 0 0 18px currentColor;
      -webkit-user-select: none; user-select: none;
    }

    /* Przykładowa treść pod spodem */
    .page { max-width: 400px; padding: 2.5rem; background: #fff; border: 1px solid #e0d8cc; border-radius: 3px; box-shadow: 0 2px 20px rgba(0,0,0,.06); }
    .page h1 { font-size: 1.6rem; margin-bottom: .6rem; }
    .page p  { font-size: .93rem; line-height: 1.75; color: #555; margin-bottom: .8rem; }

    /* Przycisk */
    button {
      display: block; margin: 1.4rem auto 0; padding: .6rem 1.4rem;
      background: #1a1a1a; color: #f5f1ea; border: none; border-radius: 3px;
      font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: .35; cursor: default; }
    #info { text-align: center; font-size: .7rem; color: #aaa; margin-top: .5rem; letter-spacing: .04em; }
  </style>
</head>
<body>

  <!-- ZNAK WODNY -->
  <div id="wm" aria-hidden="true"><span id="wm-text">POUFNE</span></div>

  <!-- treść strony -->
  <div class="page">
    <h1>Dokument zastrzeżony</h1>
    <p>Przechylaj telefon w lewo lub prawo — znak wodny subtelnie zmienia barwę, tak jak prawdziwy druk holograficzny reaguje na światło.</p>
    <p>Wymaga HTTPS (np. Netlify Drop) — iOS blokuje czujniki na http://.</p>
    <button id="btn">Włącz czujniki</button>
    <p id="info">Oczekiwanie…</p>
  </div>

  <script>
  (function(){
    var wm   = document.getElementById('wm-text');
    var btn  = document.getElementById('btn');
    var info = document.getElementById('info');

    // gamma wygładzana wykładniczo — zapobiega drganiom
    var smooth = 0;

    function setColor(gamma){
      // gamma: -90 (lewo) … 0 (prosto) … +90 (prawo)
      // mapujemy na hue: chłodny błękit ↔ ciepły sepia
      var t = Math.min(Math.max((gamma + 60) / 120, 0), 1);
      var hue = 210 + (28 - 210) * t;          // 210=niebieski, 28=sepia
      var sat = 18 + 10 * Math.abs(t - .5) * 2; // lekko bardziej nasycony na krańcach
      var opa = 0.11 + 0.05 * Math.abs(t - .5) * 2; // przy przechyle lekko wyraźniejszy
      wm.style.color   = 'hsl('+hue+','+sat+'%,32%)';
      wm.style.opacity = opa;
    }

    function onTilt(e){
      if (e.gamma == null) return;
      // wygładzanie
      smooth += (Math.min(Math.max(e.gamma,-75),75) - smooth) * 0.1;
      setColor(smooth);
    }

    function start(){
      window.addEventListener('deviceorientation', onTilt, true);
      btn.disabled = true;
      info.textContent = '✓ Aktywne — przechylaj telefon';
    }

    btn.addEventListener('click', function(){
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        // iOS 13+ — wymaga gestu użytkownika
        DeviceOrientationEvent.requestPermission()
          .then(function(s){ s === 'granted' ? start() : fallback(); })
          .catch(fallback);
      } else if (typeof DeviceOrientationEvent !== 'undefined') {
        start(); // Android / desktop
      } else {
        fallback();
      }
    });

    // Fallback: animacja sinusoidalna gdy brak czujnika / brak zgody
    function fallback(){
      info.textContent = '— Tryb auto (brak czujnika)';
      btn.disabled = true;
      var t = 0;
      (function loop(){
        t += 0.012;
        smooth += (Math.sin(t) * 55 - smooth) * 0.04;
        setColor(smooth);
        requestAnimationFrame(loop);
      })();
    }

    // Pierwsze wyświetlenie
    setColor(0);
    info.textContent = location.protocol === 'https:'
      ? 'Kliknij przycisk powyżej'
      : '⚠ Potrzebne HTTPS dla czujników';
  })();
  </script>
</body>
</html>
