<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <div>
            <img src="img/godlo.jpeg" alt="" width="8%">
        </div>
        </header>
        <h1>Cześć!</h1>
        <p>wpisz PIN, aby zalogować się do aplikacji.</p>
    
    <main>
        <form id="pinForm" action="menu/menu.html">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
            <input type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code">
        </form>
        <p id="a">Nie pamiętasz PIN-u?</p>
    </main>
    <script>
        const inputs = document.querySelectorAll('input[type="text"]');
        const form = document.getElementById('pinForm');

        inputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {

                let value = (e.data || this.value).replace(/[^0-9]/g, '');
                if (value.length === 1) {
                    this.value = '●';

                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    } else {
                        form.submit();
                    }
                } else {
                    this.value = '';
                }
            });
            
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value === '●' && index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                    e.preventDefault();
                }
            });
        });
    </script>
</body>
</html>
